apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sedapal
resources:
  - ../db-deployment.yaml
  - ../backend-deployment.yaml
  - ../web-deployment.yaml
  - ../admin-deployment.yaml
images:
  - name: REGISTRO/sedapal-web
    newName: sedapal-web
    newTag: local
  - name: REGISTRO/sedapal-admin
    newName: sedapal-admin
    newTag: local
  - name: REGISTRO/sedapal-backend
    newName: sedapal-backend
    newTag: local
patches:
  - target:
      kind: Service
      name: web
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  - target:
      kind: Service
      name: admin
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30081
  - target:
      kind: Deployment
      name: backend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                env:
                  - name: CORS_ALLOWED_ORIGINS
                    value: http://localhost:8082,http://localhost:8083,http://127.0.0.1:8082,http://127.0.0.1:8083
