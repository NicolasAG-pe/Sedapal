apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hidro-avance19
resources:
  - ../local
images:
  - name: sedapal-web
    newName: hidro-avance18-web
    newTag: local
  - name: sedapal-admin
    newName: hidro-avance18-admin
    newTag: local
  - name: sedapal-backend
    newName: hidro-avance18-backend
    newTag: local
patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                env:
                  - name: CORS_ALLOWED_ORIGINS
                    value: http://localhost:8084,http://localhost:8085,http://127.0.0.1:8084,http://127.0.0.1:8085,https://localhost
