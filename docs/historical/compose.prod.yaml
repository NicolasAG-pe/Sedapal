# ============================================================
# Hidro Mejora · Override de PRODUCCIÓN
# Uso en VPS:
#   docker compose -f compose.yaml -f docs/historical/compose.prod.yaml up -d --build
# No duplica la base: solo ajusta lo que cambia en producción.
# Requiere .env de producción (ver .env.production.example).
# ============================================================

services:

  web:
    # El puerto lo define WEB_PORT=80 en el .env de producción
    # (el override NO repite ports: Compose fusiona listas y duplicaría
    #  8080+80; por eso el puerto vive en la variable, no aquí).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    # Sin ports: solo red interna (web -> backend:3000).
    # NODE_ENV y CORS_ALLOWED_ORIGINS vienen del .env de producción:
    #   NODE_ENV=production
    #   CORS_ALLOWED_ORIGINS=https://DOMINIO_EJEMPLO (o vacío = same-origin)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    # Sin ports: PostgreSQL nunca expuesto a Internet.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
