worker_processes 1;
pid /tmp/hidro-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_body_temp_path /tmp/hidro-client;
    proxy_temp_path /tmp/hidro-proxy;
    fastcgi_temp_path /tmp/hidro-fastcgi;
    uwsgi_temp_path /tmp/hidro-uwsgi;
    scgi_temp_path /tmp/hidro-scgi;
    include /etc/nginx/sites-enabled/default;
}
