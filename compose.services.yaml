# Laboratorio aislado, sin backend monolítico. Solo imágenes locales.
name: hidro-ms120-services
x-node: &node
  image: node:22-alpine
  pull_policy: never
  user: node
  working_dir: /app
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  volumes: [./Backend:/app:ro]
  networks: [lab]
x-ready: &ready
  test: [CMD, node, -e, "fetch('http://127.0.0.1:'+process.env.PORT+'/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 3s
  timeout: 3s
  retries: 15
x-core: &core
  NODE_ENV: test
  CORS_ALLOWED_ORIGINS: http://127.0.0.1:8280,http://127.0.0.1:8281,http://localhost:8280,http://localhost:8281
x-mail: &mail
  EMAIL_PROVIDER: resend
  RESEND_FROM: correo@example.invalid
x-mail-transport: &mail-transport
  <<: *mail
  NOTIFICATIONS_URL: http://notifications:3104
  NOTIFICATIONS_ALLOW_LOCAL_HTTP: '1'
  NOTIFICATIONS_INTERNAL_SECRET: ${LAB_NOTIFICATIONS_INTERNAL_SECRET:?Falta clave interna de correo}
x-auth-client: &auth-client
  <<: *core
  AUTH_INTROSPECTION_URL: http://auth:3100
  AUTH_ALLOW_LOCAL_HTTP: '1'
x-recovery: &recovery
  PASSWORD_RECOVERY_ENABLED: '1'
  PASSWORD_RECOVERY_SECRET: ${LAB_RECOVERY_SECRET:?Falta secreto de recuperación}
  PASSWORD_RECOVERY_OUTBOX_KEY: ${LAB_RECOVERY_OUTBOX_KEY:?Falta clave outbox de recuperación}
x-push: &push
  PUSH_ENABLED: '1'
  PUSH_PROVIDER: mock
  PUSH_TOKEN_KEY: ${LAB_PUSH_TOKEN_KEY:?Falta clave push de laboratorio}
services:
  db:
    image: postgres:18
    pull_policy: never
    environment:
      POSTGRES_DB: hm_micro_lab
      POSTGRES_USER: hm_fixture
      POSTGRES_PASSWORD: fixture-only-not-production
    tmpfs: ['/var/lib/postgresql:rw,nosuid,size=512m']
    volumes: [./Base-de-Datos/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, hm_fixture, -d, hm_micro_lab]
      interval: 3s
      timeout: 3s
      retries: 15
    networks: [lab]
  db-init:
    image: postgres:18
    pull_policy: never
    environment: {PGPASSWORD: fixture-only-not-production}
    volumes: [./Base-de-Datos:/sql:ro]
    networks: [lab]
    depends_on: {db: {condition: service_healthy}}
    command:
      - sh
      - -ec
      - |
        psql -v ON_ERROR_STOP=1 -h db -U hm_fixture -d hm_micro_lab -f /sql/lab/microservices-roles.sql
        for migration in 003_verificacion_correo 006_correo_outbox 007_usuario_2fa 011_recuperacion_clave 012_notificaciones_push 013_seguimiento_incidencias 015_contratos_microservicios; do
          psql -v ON_ERROR_STOP=1 -h db -U hm_fixture -d hm_micro_lab -f /sql/migrations/$$migration.sql
        done
  auth:
    <<: *node
    command: [node, services/auth/server.cjs]
    environment:
      <<: [*core, *mail, *recovery]
      PORT: '3100'
      DATABASE_URL: postgresql://hm_auth:fixture-only-not-production@db:5432/hm_micro_lab
      AUTH_TOKEN_SECRET: ${LAB_AUTH_TOKEN_SECRET:?Falta secreto de sesión}
      EMAIL_OTP_SECRET: ${LAB_EMAIL_OTP_SECRET:?Falta secreto OTP}
      EMAIL_OUTBOX_KEY: ${LAB_EMAIL_OUTBOX_KEY:?Falta clave outbox}
      TOTP_ENCRYPTION_KEY: ${LAB_TOTP_ENCRYPTION_KEY:?Falta clave TOTP}
      AUTH_INTERNAL_SECRET: ${LAB_AUTH_INTERNAL_SECRET:?Falta clave interna Auth}
      AUTH_INTERNAL_BILLING_SECRET: ${LAB_BILLING_INTERNAL_SECRET:?Falta clave de Billing}
      AUTH_INTERNAL_OPERATIONS_SECRET: ${LAB_OPERATIONS_INTERNAL_SECRET:?Falta clave de Operations}
      AUTH_INTERNAL_NOTIFICATIONS_SECRET: ${LAB_NOTIFICATIONS_AUTH_SECRET:?Falta clave de Notifications}
      AUTH_INTERNAL_REALTIME_SECRET: ${LAB_REALTIME_INTERNAL_SECRET:?Falta clave de Realtime}
      EMAIL_REGISTRATION_ENABLED: '1'
      TOTP_ENROLLMENT_ENABLED: '1'
      MICROSERVICES_REPORTING: '1'
    depends_on: {db-init: {condition: service_completed_successfully}}
    healthcheck: *ready
  billing:
    <<: *node
    command: [node, services/billing/server.cjs]
    environment:
      <<: *auth-client
      PORT: '3101'
      DATABASE_URL: postgresql://hm_billing:fixture-only-not-production@db:5432/hm_micro_lab
      AUTH_INTERNAL_CONSUMER: billing
      AUTH_INTERNAL_SECRET: ${LAB_BILLING_INTERNAL_SECRET:?Falta clave de Billing}
    depends_on: {auth: {condition: service_healthy}}
    healthcheck: *ready
  operations:
    <<: *node
    command: [node, services/operations/server.cjs]
    environment:
      <<: *auth-client
      PORT: '3102'
      DATABASE_URL: postgresql://hm_operations:fixture-only-not-production@db:5432/hm_micro_lab
      AUTH_INTERNAL_CONSUMER: operations
      AUTH_INTERNAL_SECRET: ${LAB_OPERATIONS_INTERNAL_SECRET:?Falta clave de Operations}
    depends_on: {auth: {condition: service_healthy}}
    healthcheck: *ready
  realtime:
    <<: *node
    command: [node, services/realtime/server.cjs]
    environment:
      <<: *auth-client
      PORT: '3103'
      DATABASE_URL: postgresql://hm_realtime:fixture-only-not-production@db:5432/hm_micro_lab
      AUTH_INTERNAL_CONSUMER: realtime
      AUTH_INTERNAL_SECRET: ${LAB_REALTIME_INTERNAL_SECRET:?Falta clave de Realtime}
    depends_on: {auth: {condition: service_healthy}}
    healthcheck: *ready
  notifications:
    <<: *node
    command: [node, services/notifications/server.cjs]
    environment:
      <<: [*auth-client, *mail, *push]
      PORT: '3104'
      NOTIFICATIONS_DATABASE_URL: postgresql://hm_notifications:fixture-only-not-production@db:5432/hm_micro_lab
      AUTH_INTERNAL_CONSUMER: notifications
      AUTH_INTERNAL_SECRET: ${LAB_NOTIFICATIONS_AUTH_SECRET:?Falta clave de Notifications}
      NOTIFICATIONS_DELIVERY_MODE: stub
      NOTIFICATIONS_INTERNAL_SECRET: ${LAB_NOTIFICATIONS_INTERNAL_SECRET:?Falta clave interna de correo}
    depends_on: {auth: {condition: service_healthy}}
    healthcheck: *ready
  email-worker:
    <<: *node
    command: [node, workers/email-outbox.cjs, --run]
    environment:
      <<: [*core, *mail-transport]
      EMAIL_WORKER_ENABLED: '1'
      EMAIL_WORKER_EXPECTED_DATABASE: hm_micro_lab
      EMAIL_WORKER_DATABASE_URL: postgresql://hm_auth:fixture-only-not-production@db:5432/hm_micro_lab
      EMAIL_OUTBOX_KEY: ${LAB_EMAIL_OUTBOX_KEY:?Falta clave outbox}
    depends_on: {notifications: {condition: service_healthy}}
  recovery-worker:
    <<: *node
    command: [node, workers/password-recovery.cjs, --run]
    environment:
      <<: [*core, *mail-transport, *recovery]
      PASSWORD_RECOVERY_WORKER_ENABLED: '1'
      PASSWORD_RECOVERY_EXPECTED_DATABASE: hm_micro_lab
      PASSWORD_RECOVERY_DATABASE_URL: postgresql://hm_auth:fixture-only-not-production@db:5432/hm_micro_lab
    depends_on: {notifications: {condition: service_healthy}}
  push-worker:
    <<: *node
    command: [node, workers/push.cjs, --run]
    environment:
      <<: [*core, *push]
      PUSH_WORKER_ENABLED: '1'
      PUSH_LAB_DOCKER: '1'
      PUSH_EXPECTED_DATABASE: hm_micro_lab
      PUSH_DATABASE_URL: postgresql://hm_notifications:fixture-only-not-production@db:5432/hm_micro_lab
    depends_on: {notifications: {condition: service_healthy}}
  gateway:
    <<: *node
    command: [node, services/gateway/server.cjs]
    environment:
      <<: *core
      PORT: '3000'
      GATEWAY_ALLOW_LOCAL_HTTP: '1'
      GATEWAY_TRUST_INGRESS: '1'
      AUTH_URL: http://auth:3100
      BILLING_URL: http://billing:3101
      OPERATIONS_URL: http://operations:3102
      REALTIME_URL: http://realtime:3103
      NOTIFICATIONS_URL: http://notifications:3104
    healthcheck: *ready
    networks:
      lab: {aliases: [backend]}
    depends_on:
      auth: {condition: service_healthy}
      billing: {condition: service_healthy}
      operations: {condition: service_healthy}
      realtime: {condition: service_healthy}
      notifications: {condition: service_healthy}
  web:
    image: nginx:stable-alpine
    pull_policy: never
    ports: ['127.0.0.1:8280:80']
    volumes:
      - ./artifacts/microservices/web:/var/www/html:ro
      - ./Frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [lab, edge]
    depends_on: {gateway: {condition: service_healthy}}
  admin:
    image: nginx:stable-alpine
    pull_policy: never
    ports: ['127.0.0.1:8281:80']
    volumes:
      - ./artifacts/microservices/admin:/usr/share/nginx/html:ro
      - ./Admin/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [lab, edge]
    depends_on: {gateway: {condition: service_healthy}}
networks:
  lab: {internal: true}
  edge: {}
