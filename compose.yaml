# Hidro-Mejora en Docker Compose: cuatro servicios con responsabilidades separadas.
#   web   (Nginx, cliente)                 -> red "edge"
#   admin (Nginx, panel administrativo)    -> red "edge"
#   backend (Node/Express/Socket.IO)       -> red "edge" + "data"
#   db    (PostgreSQL 18)                  -> red "data" (interna, sin salida)
# Solo web y admin publican puertos al host; backend y db quedan en red interna.
# Versiones y releases de cada herramienta: docs/VERSIONES.md
services:

  web:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    # WEB_PORT configurable: 8080 en desarrollo, 80 en producción
    # (ver WEB_PORT=80 en .env.production.example). No tocar 3000/5432.
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: Admin/Dockerfile
    ports:
      - "${ADMIN_PORT:-8081}:80"
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: ./Backend

    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:8081}
      NODE_ENV: ${NODE_ENV:-development}
      RESEND_FROM: ${RESEND_FROM:-}
      EMAIL_OTP_SECRET: ${EMAIL_OTP_SECRET:-}
      EMAIL_OUTBOX_KEY: ${EMAIL_OUTBOX_KEY:-}

    # Backend solo en red interna (web -> backend:3000 vía Nginx).
    # Sin publicación al host: las pruebas usan http://localhost:8080/api/*.
    expose:
      - "3000"
    networks:
      - edge
      - data

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped


  db:
    image: postgres:18

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # HARDENING: sin ports publicados. Solo red interna Docker (db:5432).
    # Acceso local vía: docker compose exec db psql ...
    # Para depuración temporal local, usar override (no commitear puertos públicos).
    expose:
      - "5432"
    networks:
      - data

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./Base-de-Datos/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


volumes:
  postgres_data:

networks:
  # Red de borde: clientes Nginx y API. Es la única con salida al exterior.
  edge:
  # Red de datos: solo API y PostgreSQL. `internal` evita tráfico hacia fuera.
  data:
    internal: true
