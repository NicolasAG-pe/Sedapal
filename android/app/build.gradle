apply plugin: 'com.android.application'

// Una compilación cliente aislada conserva todos los APK y outputs anteriores.
if (project.hasProperty('hidroBuildDir')) {
    layout.buildDirectory.set(file(project.property('hidroBuildDir')))
}

// Solo el entorno del proceso contiene credenciales; nunca el repositorio.
def releaseSigning = [
    storeFile: System.getenv('HM_RELEASE_STORE_FILE'),
    storePassword: System.getenv('HM_RELEASE_STORE_PASSWORD'),
    keyAlias: System.getenv('HM_RELEASE_KEY_ALIAS'),
    keyPassword: System.getenv('HM_RELEASE_KEY_PASSWORD')
]

android {
    namespace "pe.edu.hidromejora.app"
    compileSdk rootProject.ext.compileSdkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    defaultConfig {
        applicationId "pe.edu.hidromejora.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigning.storeFile) storeFile file(releaseSigning.storeFile)
            storePassword releaseSigning.storePassword
            keyAlias releaseSigning.keyAlias
            keyPassword releaseSigning.keyPassword
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// También protege assemble/bundle invocados directamente, sin el script auxiliar.
def validateReleaseSigning = tasks.register('validateReleaseSigning') {
    doLast {
        if (releaseSigning.values().any { !it?.trim() }) {
            throw new GradleException('Faltan variables privadas de firma release. Consulta docs/ANDROID-RELEASE.md.')
        }
        try {
            def store = file(releaseSigning.storeFile).canonicalFile
            def repository = rootProject.projectDir.parentFile.canonicalPath + File.separator
            if (!store.isFile() || store.canonicalPath.startsWith(repository)) {
                throw new Exception('Almacén de firma inválido.')
            }
            def keyStore = java.security.KeyStore.getInstance(store, releaseSigning.storePassword.toCharArray())
            def certificate = keyStore.getCertificate(releaseSigning.keyAlias)
            def key = keyStore.getKey(releaseSigning.keyAlias, releaseSigning.keyPassword.toCharArray())
            if (!(key instanceof java.security.PrivateKey) || certificate == null) {
                throw new Exception('Identidad de firma inválida.')
            }
            certificate.checkValidity()
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString()
            def expected = rootProject.file('release-certificate.sha256').text.trim().toLowerCase()
            if (!(expected ==~ /[0-9a-f]{64}/) || actual != expected) {
                throw new Exception('Certificado distinto al permanente.')
            }
        } catch (Exception ignored) {
            // No propagar excepciones del keystore: pueden incluir el alias privado.
            throw new GradleException('No se pudo validar la firma release permanente. Revisa la configuración privada y el certificado público.')
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild' || task.name == 'validateSigningRelease') {
        task.dependsOn(validateReleaseSigning)
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
