apply plugin: 'com.android.application'

// Una compilación cliente aislada conserva todos los APK y outputs anteriores.
if (project.hasProperty('hidroBuildDir')) {
    layout.buildDirectory.set(file(project.property('hidroBuildDir')))
}

// Solo el entorno del proceso contiene credenciales; nunca el repositorio.
def releaseSigning = [
    storeFile: System.getenv('HM_RELEASE_STORE_FILE'),
    storePassword: System.getenv('HM_RELEASE_STORE_PASSWORD'),
    keyAlias: System.getenv('HM_RELEASE_KEY_ALIAS'),
    keyPassword: System.getenv('HM_RELEASE_KEY_PASSWORD')
]
def laboratory = System.getenv('HM_ANDROID_LAB') == '1'
def labSigning = ['STORE_FILE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD'].collectEntries {
    [(it): System.getenv('HM_LAB_' + it)]
}

android {
    namespace "pe.edu.hidromejora.app"
    testBuildType laboratory ? 'lab' : 'debug'
    compileSdk rootProject.ext.compileSdkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    defaultConfig {
        applicationId "pe.edu.hidromejora.app"
        // Sin configuración privada autorizada no se registra Firebase.
        buildConfigField "boolean", "HM_PUSH_CONFIGURED", (file('google-services.json').isFile() && System.getenv('HM_PUSH_ANDROID_ENABLED') == '1').toString()
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        lab {
            if (labSigning.STORE_FILE) storeFile file(labSigning.STORE_FILE)
            storePassword labSigning.STORE_PASSWORD
            keyAlias labSigning.KEY_ALIAS
            keyPassword labSigning.KEY_PASSWORD
        }
        release {
            if (releaseSigning.storeFile) storeFile file(releaseSigning.storeFile)
            storePassword releaseSigning.storePassword
            keyAlias releaseSigning.keyAlias
            keyPassword releaseSigning.keyPassword
        }
    }
    buildTypes {
        lab {
            initWith debug
            applicationIdSuffix '.lab120'
            versionNameSuffix '-lab.1'
            signingConfig signingConfigs.lab
            matchingFallbacks = ['debug']
            resValue 'string', 'app_name', 'Hidro-Mejora LAB'
            resValue 'string', 'title_activity_main', 'Hidro-Mejora LAB'
            buildConfigField 'boolean', 'HM_PUSH_CONFIGURED', 'false'
        }
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

android.applicationVariants.all { variant ->
    if (variant.buildType.name == 'lab') {
        variant.outputs.all { versionNameOverride = '1.2.0-lab.1' }
    }
}
tasks.register('validateLaboratory') {
    doLast {
        if (!laboratory || System.getenv('HM_PUSH_ANDROID_ENABLED') != '0' ||
            System.getenv('API_BASE_URL') != 'http://127.0.0.1:45679' || file('google-services.json').exists()) {
            throw new GradleException('LAB requiere configuración explícita, API por USB local y Firebase desactivado.')
        }
        if (labSigning.values().any { !it?.trim() } ||
            !file(labSigning.STORE_FILE).isFile() ||
            file(labSigning.STORE_FILE).canonicalPath.startsWith(rootProject.projectDir.parentFile.canonicalPath + File.separator)) {
            throw new GradleException('LAB requiere firma privada independiente fuera del repositorio.')
        }
        def ks = java.security.KeyStore.getInstance(file(labSigning.STORE_FILE), labSigning.STORE_PASSWORD.toCharArray())
        def certificate = ks.getCertificate(labSigning.KEY_ALIAS)
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString()
        if (actual == rootProject.file('release-certificate.sha256').text.trim().toLowerCase()) {
            throw new GradleException('La firma LAB debe ser distinta de la permanente.')
        }
        def config = new groovy.json.JsonSlurper().parse(rootProject.file('app/src/main/assets/capacitor.config.json'))
        if (config.appId != 'pe.edu.hidromejora.app.lab120') throw new GradleException('Sin runtime LAB aislado.')
    }
}
tasks.configureEach { task ->
    if (task.name == 'preLabBuild' || task.name == 'validateSigningLab') task.dependsOn('validateLaboratory')
}

// También protege assemble/bundle invocados directamente, sin el script auxiliar.
def validateReleaseSigning = tasks.register('validateReleaseSigning') {
    doLast {
        if (releaseSigning.values().any { !it?.trim() }) {
            throw new GradleException('Faltan variables privadas de firma release. Consulta docs/ANDROID-RELEASE.md.')
        }
        try {
            def store = file(releaseSigning.storeFile).canonicalFile
            def repository = rootProject.projectDir.parentFile.canonicalPath + File.separator
            if (!store.isFile() || store.canonicalPath.startsWith(repository)) {
                throw new Exception('Almacén de firma inválido.')
            }
            def keyStore = java.security.KeyStore.getInstance(store, releaseSigning.storePassword.toCharArray())
            def certificate = keyStore.getCertificate(releaseSigning.keyAlias)
            def key = keyStore.getKey(releaseSigning.keyAlias, releaseSigning.keyPassword.toCharArray())
            if (!(key instanceof java.security.PrivateKey) || certificate == null) {
                throw new Exception('Identidad de firma inválida.')
            }
            certificate.checkValidity()
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString()
            def expected = rootProject.file('release-certificate.sha256').text.trim().toLowerCase()
            if (!(expected ==~ /[0-9a-f]{64}/) || actual != expected) {
                throw new Exception('Certificado distinto al permanente.')
            }
        } catch (Exception ignored) {
            // No propagar excepciones del keystore: pueden incluir el alias privado.
            throw new GradleException('No se pudo validar la firma release permanente. Revisa la configuración privada y el certificado público.')
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild' || task.name == 'validateSigningRelease') {
        task.dependsOn(validateReleaseSigning)
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
