name: Hidro-Mejora CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['chore/**', 'feature/**', 'fix/**', 'integration/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  safe:
    name: Unitarias y contratos (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # El contrato Android compara con el tag v1.0.0.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Dependencias Backend desde lockfile, sin scripts
        run: npm ci --prefix Backend --ignore-scripts --no-audit --no-fund
      - name: Inventario completo
        run: npm run test:inventory
      - name: Pruebas seguras y contratos PKG-01
        run: npm test -- --report
      - name: Reportes seguros
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: safe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/tests/safe-*/junit.xml
            artifacts/tests/safe-*/run.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false

  integration:
    name: Integración sintética (PostgreSQL 18)
    needs: safe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hm_email_test
          POSTGRES_USER: hm_fixture
          POSTGRES_PASSWORD: fixture-only-not-production
        ports:
          - '127.0.0.1::5432'
        options: >-
          --label hidro.sdd.test=ci01
          --tmpfs /var/lib/postgresql:rw,nosuid,size=2048m
          --health-cmd "pg_isready -U hm_fixture -d hm_email_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      HIDRO_TEST_ISOLATED_DB: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Dependencias Backend desde lockfile, sin scripts
        run: npm ci --prefix Backend --ignore-scripts --no-audit --no-fund
      - name: Regresiones de perfiles y recibos DB-01
        env:
          HIDRO_EMAIL_TEST_DB_PORT: ${{ job.services.postgres.ports[5432] }}
        run: npm run test:integration -- --report
      - name: Reportes seguros
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/tests/integration-*/junit.xml
            artifacts/tests/integration-*/run.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
